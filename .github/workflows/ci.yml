name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mcp_smoke:
        description: Download and smoke-test optional registry MCPs
        type: boolean
        default: false

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Package wiring
        run: python scripts/check_package.py
      - name: Skill and host metadata
        run: python scripts/validate_skills.py
      - name: Hook self-checks
        run: |
          python hooks/file_size_gate.py --test
          python hooks/session_start.py --test
      - name: Source word budget
        run: python scripts/size_audit.py .
      - uses: actions/setup-node@v4
        if: inputs.mcp_smoke
        with:
          node-version: "22"
      - name: Optional live MCP discovery
        if: inputs.mcp_smoke
        run: python scripts/mcp_smoke.py .

  browser-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
